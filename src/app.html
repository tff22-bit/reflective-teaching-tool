<title>المحقق التأملي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Minimal modern app: slim header, narrow collapsible sidebar, centered reading column. */
:root {
  --bg: #f6f9fa;
  --surface: #ffffff;
  --fg: #17323a;
  --muted: #5b727a;
  --line: #dbe5e8;
  --teal: #0f5560;
  --teal-soft: #e8f2f3;
  --on-teal: #ffffff;
  --gold: #b8923a;
  --gold-ink: #86661b;
  --gold-soft: #f6efdc;
  --leaf: #5f8a4e;
  --focus: #1b7f8c;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  /* banner: shows the top 330px of the 2172x724 image (everything down to the gold line) */
  --bh: max(108px, 15.19vw);
  --banner-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1c20; --surface: #162a30; --fg: #e6f0f2; --muted: #9db4ba; --line: #274047;
    --teal: #6cc4cf; --teal-soft: #19363c; --on-teal: #0f1c20; --gold: #d8b25e; --gold-ink: #d8b25e; --gold-soft: #2f2a1a;
    --leaf: #8fc07b; --focus: #6cc4cf; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1c20; --surface: #162a30; --fg: #e6f0f2; --muted: #9db4ba; --line: #274047;
  --teal: #6cc4cf; --teal-soft: #19363c; --on-teal: #0f1c20; --gold: #d8b25e; --gold-ink: #d8b25e; --gold-soft: #2f2a1a;
  --leaf: #8fc07b; --focus: #6cc4cf; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--banner-bg);
}
button, textarea, a { font-family: var(--font); }
button, textarea { font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header: approved banner image, full width, natural proportions */
.top { position: relative; height: var(--bh); overflow: hidden; background: var(--banner-bg); }
.top h1 { margin: 0; position: absolute; inset: 0; }
.banner-img { position: absolute; top: 0; right: 0; display: block; max-width: none; height: auto; width: max(100%, calc(var(--bh) * 6.582)); }
.menu-btn {
  position: absolute; top: 8px; left: max(8px, env(safe-area-inset-left, 0px)); z-index: 2;
  width: 40px; height: 40px; display: grid; place-items: center;
  background: rgba(255, 255, 255, .92); border: 1px solid #dbe5e8; border-radius: 10px; color: #0f5560;
}
.menu-btn:hover { background: #e8f2f3; }

/* shell and sidebar */
.shell { display: flex; align-items: stretch; min-height: calc(100dvh - var(--bh)); }
.side {
  flex: none; width: 176px; align-self: flex-start; position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: calc(100dvh - env(safe-area-inset-top, 0px)); padding: 16px 8px 16px 12px; padding-right: var(--gutter-r);
  border-inline-end: 1px solid var(--line);
}
.side[hidden] { display: none; }
.side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav {
  width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; text-align: start;
  background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--fg);
  font-size: .92rem; text-decoration: none; line-height: 1.5;
}
.nav svg { flex: none; width: 18px; height: 18px; }
.nav:hover:not(:disabled) { background: var(--teal-soft); }
.nav[aria-current="page"] { background: var(--teal-soft); color: var(--teal); font-weight: 600; }
.nav:disabled { color: var(--muted); cursor: default; }
.tag { margin-inline-start: 28px; font-size: .7rem; color: var(--muted); line-height: 1.4; }
.backdrop { display: none; }

main {
  flex: 1; min-width: 0; padding-block: 32px 56px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.col { max-width: 640px; margin: 0 auto; }
.col:has(.report) { max-width: 760px; }

/* home: welcome block centered in the free area */
.home {
  min-height: calc(100dvh - var(--bh) - 88px); display: grid; place-content: center; justify-items: center;
  text-align: center; gap: 0;
}
.home h2 { margin: 0 0 12px; font-size: 2rem; line-height: 1.4; color: var(--teal); font-weight: 700; text-wrap: balance; }
.home p { margin: 0 0 28px; font-size: 1.05rem; color: var(--muted); max-width: 42ch; }
.home .btn-primary { min-height: 50px; padding: 8px 40px; font-size: 1.05rem; border-radius: 12px; }
.count { margin: 16px 0 0; font-size: .78rem; color: var(--muted); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
  padding: 6px 20px; border-radius: 10px; font-size: .95rem; border: 1px solid var(--teal); font-weight: 600;
}
.btn-primary { background: var(--teal); color: var(--on-teal); }
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost { background: transparent; color: var(--teal); border-color: var(--line); }
.btn-ghost:hover:not(:disabled) { background: var(--teal-soft); border-color: var(--teal); }
.btn:disabled { opacity: .4; cursor: default; }

/* progress */
.prog { margin-bottom: 28px; }
.prog-row { display: flex; justify-content: space-between; gap: 12px; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
.bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 99px; transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

/* question */
.phase { margin: 0 0 8px; font-size: .82rem; font-weight: 600; color: var(--gold-ink); letter-spacing: .02em; }
.phase span { color: var(--muted); font-weight: 400; }
.q { margin: 0 0 10px; font-size: 1.55rem; line-height: 1.55; font-weight: 700; color: var(--fg); text-wrap: balance; }
.hint { margin: 0 0 4px; color: var(--muted); font-size: .9rem; }
.hint b { font-weight: 600; }
.lbl { display: block; margin: 22px 0 8px; font-weight: 600; font-size: .85rem; color: var(--muted); }
textarea {
  display: block; width: 100%; min-height: 130px; resize: vertical; padding: 12px 14px; line-height: 1.75;
  font-size: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
textarea:focus { border-color: var(--focus); outline: 0; box-shadow: 0 0 0 3px var(--teal-soft); }
.help-wrap { margin-top: 14px; }
.opts { margin-top: 12px; display: grid; gap: 8px; }
.opt {
  text-align: start; width: 100%; padding: 9px 14px; border-radius: 10px; min-height: 42px; font-size: .95rem;
  background: var(--surface); border: 1px solid var(--line);
}
.opt:hover { border-color: var(--teal); }
.opt[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); font-weight: 600; color: var(--teal); }
.follow { margin-top: 20px; padding-inline-start: 14px; border-inline-start: 2px solid var(--gold); }
.follow .lbl { margin-top: 0; color: var(--teal); font-weight: 600; font-size: .95rem; }
textarea.sm { min-height: 84px; }
.nav-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; }
.nav-row .btn { flex: 0 1 140px; }
.link-btn { justify-self: start; background: none; border: 0; padding: 2px 0; color: var(--teal); font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }
.saved { margin: 12px 0 0; font-size: .78rem; color: var(--muted); }

.done { padding-top: 24px; }
.done h2 { margin: 0 0 8px; color: var(--teal); font-size: 1.3rem; }
.done p { margin: 0 0 20px; font-size: 1.05rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.confirm { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 10px; }
.confirm p { margin: 0 0 12px; }

/* report */
.rep-head { display: grid; gap: 14px; margin-bottom: 4px; }
.rep-head h2 { margin: 0; font-size: 1.6rem; color: var(--teal); line-height: 1.4; }
.rep-head .btn { min-height: 38px; padding: 4px 14px; font-size: .88rem; }
.sec { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); }
.sec-h { margin: 0 0 18px; font-size: 1.25rem; color: var(--teal); line-height: 1.4; }
.group { margin-bottom: 22px; }
.group h3 { margin: 0 0 6px; font-size: .85rem; font-weight: 600; color: var(--gold-ink); }
.item { display: grid; grid-template-columns: 9rem minmax(0, 1fr); column-gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.group .item:last-child { border-bottom: 0; }
.item h4 { grid-column: 1; grid-row: 1 / span 12; margin: 2px 0 0; font-size: .85rem; font-weight: 500; color: var(--muted); }
.item > :not(h4) { grid-column: 2; }
.ans { margin: 0 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1rem; }
.fq { margin: 8px 0 2px; font-size: .82rem; color: var(--muted); }
.sub { margin: 10px 0 2px; font-size: .82rem; color: var(--muted); }
.none { margin: 0; color: var(--muted); font-size: .9rem; }
.chip { justify-self: start; display: inline-block; padding: 1px 12px; margin-bottom: 4px; border-radius: 99px; background: var(--teal-soft); color: var(--teal); font-size: .85rem; font-weight: 600; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.notes li { padding-inline-start: 14px; border-inline-start: 2px solid var(--teal-soft); font-size: 1rem; line-height: 1.85; }
.plan { padding-inline-start: 16px; border-inline-start: 3px solid var(--gold); display: grid; gap: 2px; }
.plan .item { border-bottom: 0; padding: 8px 0; }
.plan .item h4 { color: var(--teal); font-weight: 600; font-size: .9rem; }

@media (max-width: 800px) {
  .side {
    position: fixed; z-index: 35; top: 0; right: 0; height: 100dvh; width: min(220px, 72vw);
    padding-top: calc(env(safe-area-inset-top, 0px) + 24px); padding-left: 12px;
    background: var(--surface); border-inline-end: 0; border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12);
  }
  .backdrop { position: fixed; inset: 0; z-index: 34; background: rgba(10, 30, 36, .35); }
  .backdrop:not([hidden]) { display: block; }
  main { padding-block: 24px 48px; }
  .home { min-height: calc(100dvh - var(--bh) - 72px); }
  .home h2 { font-size: 1.6rem; }
  .q { font-size: 1.3rem; }
  .prog { margin-bottom: 22px; }
  .item { display: block; }
  .item h4 { margin: 0 0 2px; }
  .rep-head h2 { font-size: 1.4rem; }
}
@media print {
  :root:root:root:root { --bg:#fff; --surface:#fff; --fg:#111; --muted:#444; --line:#ccc; --teal:#0f5560; --teal-soft:#eef5f6; --gold:#8a6a1e; --gold-ink:#8a6a1e; color-scheme: light; }
  .top, .side, .backdrop, .no-print, body::before { display: none !important; }
  .shell { display: block; min-height: 0; }
  main { padding: 0; }
  .col, .col:has(.report) { max-width: none; }
  .item { display: block; }
  .group, .item, .plan { break-inside: avoid; }
  .sec-h, .group h3 { break-after: avoid; }
}
</style>

<header class="top">
  <h1><img class="banner-img" src="banner.png" width="2172" height="724" alt="المحقق التأملي — أداة لدعم المعلمة في ممارسة التدريس التأملي"></h1>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="القائمة الجانبية" aria-controls="side" aria-expanded="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="القائمة الجانبية">
    <ul>
      <li><button class="nav" type="button" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button></li>
      <li><button class="nav" type="button" data-go="session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>جلسة التأمل</button></li>
      <li><button class="nav" type="button" data-go="results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>نتائج تأملي</button></li>
      <li id="evalLi"></li>
    </ul>
  </nav>
  <div class="backdrop" id="backdrop" hidden></div>
  <main id="main"><div class="col" id="view"></div></main>
</div>

<script>
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";

const PHASES = [
  "المرحلة الأولى: فهم الموقف",
  "المرحلة الثانية: فهم القرار",
  "المرحلة الثالثة: مراجعة ما حدث",
  "المرحلة الرابعة: استكشاف البدائل",
  "المرحلة الخامسة: التخطيط للتحسين",
  "المرحلة السادسة: التأمل الشخصي"
];
// two questions per phase
const QUESTIONS = [
  { q: "حدثيني عن موقف وقع في الفصل ولفت انتباهك.",
    hint: "ليس بالضرورة أن يكون موقفًا صعبًا؛ فقد يكون تجربة ناجحة أو موقفًا لم يسر كما توقعتِ.",
    opts: ["موقف مع طالبة أو مجموعة من الطالبات","موقف أثناء شرح الدرس","موقف يتعلق بالتفاعل والمشاركة","موقف يتعلق بإدارة الفصل","موقف ناجح أود فهم أسباب نجاحه","موقف آخر"],
    follow: "هل يمكنك وصف ما حدث في هذا الموقف؟" },
  { q: "كيف تصرفتِ في ذلك الوقت؟",
    opts: ["تدخلت مباشرة","غيّرت طريقة الشرح أو النشاط","تحدثت مع الطالبة أو الطالبات","واصلت الحصة دون تدخل","اتخذت إجراءً آخر"],
    follow: "كيف نفذتِ هذا التصرف؟" },
  { q: "ما الهدف الأساسي الذي كنتِ تسعين إلى تحقيقه من تصرفك؟",
    opts: ["المحافظة على نظام الفصل","مساعدة الطالبات على الفهم","المحافظة على سلامة الطالبات","تشجيع المشاركة والتفاعل","مواصلة الحصة دون تعطيل","هدف آخر"],
    follow: "لماذا كان هذا الهدف مهمًا بالنسبة إليكِ في ذلك الوقت؟" },
  { q: "ما الذي دفعك إلى اختيار هذا التصرف تحديدًا؟",
    opts: ["اعتمدت على تجربة سابقة","رأيت أنه الحل الأنسب في تلك اللحظة","لم يكن لدي وقت كافٍ للتفكير في بديل","اعتدت استخدام هذا الأسلوب","اتبعت تعليمات المدرسة أو إجراءاتها","سبب آخر"],
    follow: "كيف أثّر هذا السبب في قرارك؟" },
  { q: "ماذا حدث بعد أن اتخذتِ هذا الإجراء؟",
    opts: ["تحسن الموقف","لم يتغير الموقف","أصبح الموقف أكثر صعوبة","لاحظت نتيجة مختلفة عما توقعت","لم أتمكن من تحديد النتيجة"],
    follow: "ما الذي لاحظتِه وجعلك تختارين هذه الإجابة؟" },
  { q: "عندما تفكرين في الموقف الآن، هل هناك جانب ربما لم تنتبهي إليه في حينه؟",
    opts: ["ربما كان هناك سبب آخر لتصرف الطالبة","ربما أثرت مشاعري في قراري","ربما اعتمدت على افتراض سابق","ربما لم أفهم احتياجات الطالبات بصورة كاملة","لا أرى أنني أغفلت جانبًا مهمًا","لست متأكدة"],
    follow: "ما الذي يدفعك إلى التفكير في هذا الاحتمال؟" },
  { q: "لو واجهتِ الموقف نفسه مرة أخرى، كيف يمكن أن تتصرفي؟",
    opts: ["سأكرر التصرف نفسه","سأغير طريقة تعاملي","سأمنح الطالبات فرصة لتوضيح وجهات نظرهن","سأستخدم استراتيجية تدريس مختلفة","سأطلب المساعدة أو الاستشارة","لم أحدد بعد ما هو الأنسب"],
    follow: "لماذا ترين أن هذا الخيار مناسب؟" },
  { q: "ما الذي يمكن أن يساعدك على التحقق من ملاءمة قرارك؟",
    opts: ["الاستماع إلى وجهة نظر الطالبة أو الطالبات","ملاحظة تفاعلهن وسلوكهن","مراجعة أعمالهن أو إجاباتهن","استشارة زميلة أو المرشدة الطلابية","تجربة طريقة مختلفة وملاحظة أثرها","وسيلة أخرى"],
    follow: "كيف يمكنك الاستفادة من هذه الوسيلة في موقف مشابه؟" },
  { q: "ما الخطوة البسيطة التي يمكنك تجربتها في الحصة القادمة؟",
    opts: ["تغيير طريقة الشرح أو النشاط","زيادة مشاركة الطالبات","التحقق من أسباب السلوك قبل اتخاذ القرار","تحسين طريقة التواصل مع الطالبات","متابعة موقف معين بصورة أدق","خطوة أخرى"],
    follow: "كيف ستطبقين هذه الخطوة عمليًا؟" },
  { q: "كيف ستعرفين أن الخطوة التي جرّبتِها حققت أثرًا إيجابيًا؟",
    opts: ["ملاحظة تحسن مشاركة الطالبات","ملاحظة تغير في السلوك","مقارنة إجابات الطالبات أو نتائجهن","سؤال الطالبات عن تجربتهن","متابعة تكرار الموقف وأسبابه","مؤشر آخر"],
    follow: "ما الدليل الذي ستوثقينه بعد التطبيق؟" },
  { q: "بعد مراجعة الموقف، ما الذي اكتشفتِه عن طريقة تدريسك أو قراراتك؟",
    opts: ["أدركت أنني أتعجل أحيانًا في اتخاذ القرار","انتبهت إلى احتياج لم أكن أضعه في الحسبان","اكتشفت وجود بدائل أخرى","تعرفت على نقطة قوة في ممارستي","تأكدت من ملاءمة تصرفي، وأدركت أهمية التحقق من أثره","ما زلت بحاجة إلى مزيد من التفكير"],
    follow: "هل يمكنك التعبير عن هذا الاكتشاف بكلماتك؟" },
  { q: "إذا واجهتِ موقفًا مشابهًا مستقبلًا، فما أهم أمر ستحرصين عليه؟",
    opts: ["فهم أسباب الموقف قبل إصدار حكم","التفكير في أكثر من حل","مراعاة احتياجات الطالبات","الاستناد إلى الملاحظات والأدلة","متابعة أثر القرار بعد تطبيقه","أمر آخر"],
    follow: "اكتبي لنفسك تذكيرًا قصيرًا تستفيدين منه في الحصة القادمة." }
];
const N = QUESTIONS.length;
// Follow-up questions keyed by fixed option index (same order as QUESTIONS[i].opts).
// null = no follow-up; string = one fixed follow-up; array = one follow-up per option.
const FOLLOW = [
  null,
  null,
  "لماذا كان هذا الهدف مهمًا بالنسبة لك في ذلك الموقف؟",
  ["ما أوجه التشابه بين الموقف الحالي وتجربتك السابقة؟",

function followFor(i, c) {
  const f = FOLLOW[i];
  if (c === null || c === undefined || !f) return null;
  return Array.isArray(f) ? (f[c] || null) : f;
}
function followKey(i, c) {

const KEY = "muhaqqiq-taammuli-v1";

let state = { view: "home", step: 0, answers: {}, counted: false };
let memoryOnly = false;
try {

      state.step = Math.min(Math.max(parseInt(s.step) || 0, 0), N - 1);

}

async function api(opts) {

  finally { clearTimeout(t); }
}
async function loadCount() {

}
// Counts one start per session. Failures never affect the tool.
async function countStart() {
  if (state.counted || counting) return;
  counting = true;
  try {
    const r = await api({ method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ event: "start" }) });
    if (r.ok || r.status === 429) {

}

function parts(i) {
  const a = state.answers[i] || {};

  const fOk = fq && a.fk === followKey(i, c) && (a.follow || "").trim();
  return {
    chip: c !== null ? QUESTIONS[i].opts[c] : "",
    text: (a.text || "").trim(),

const para = (t) => `<p class="ans">${esc(t)}</p>`;

// mode: all | main | follow. quiet: return "" instead of the empty notice.
function entry(i, mode = "all", quiet = false) {
  const p = parts(i);

    if (p.chip) h += `<span class="chip">${esc(p.chip)}</span>`;
    if (p.text) h += para(p.text);

    h += mode === "follow" ? para(p.follow) : `<p class="fq">${esc(p.fq)}</p>${para(p.follow)}`;

  view.querySelectorAll("[data-goto]").forEach((b) => (b.onclick = () => { state.view = "session"; state.step = +b.dataset.goto; save(); render(); window.scrollTo(0, 0); }));
  $("#resetBtn").onclick = () => {
    $("#confirmBox").innerHTML = `<div class="confirm"><p>سيتم حذف كل إجاباتك المحفوظة والتقرير الحالي. هل تريدين المتابعة؟</p>
      <div class="row"><button class="btn btn-primary" type="button" id="yesReset">نعم، ابدئي تأملًا جديدًا</button>
      <button class="btn btn-ghost" type="button" id="noReset">إلغاء</button></div></div>`;
    $("#yesReset").onclick = () => { state = { view: "session", step: 0, answers: {}, counted: false }; helpOpen = {}; changing = {}; save(); render(); window.scrollTo(0, 0); countStart(); };
    $("#noReset").onclick = () => { $("#confirmBox").innerHTML = ""; };
  };
}

function go(v) {
  state.view = v === "results" ? "done" : v === "session" ? "session" : "home";
  save(); render(); window.scrollTo(0, 0);
  if (v === "session") countStart();
  if (mobile()) setSide(false);
}

const side = $("#side"), menuBtn = $("#menuBtn"), backdrop = $("#backdrop");
const mobile = () => window.matchMedia("(max-width: 800px)").matches;
function setSide(open) {
  side.hidden = !open;
  menuBtn.setAttribute("aria-expanded", String(open));
  backdrop.hidden = !(open && mobile());
}
menuBtn.onclick = () => setSide(side.hidden);
backdrop.onclick = () => setSide(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && mobile()) setSide(false); });
document.querySelectorAll(".nav[data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go)));
setSide(!mobile());

render();
</script>
