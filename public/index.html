<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}html{color-scheme:only light;background:#f6f9fa}body{margin:0}</style>
<title>المحقق التأملي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Minimal modern app: slim header, narrow collapsible sidebar, centered reading column. */
:root {
  --bg: #f6f9fa;
  --surface: #ffffff;
  --fg: #17323a;
  --muted: #5b727a;
  --line: #dbe5e8;
  --teal: #0f5560;
  --teal-soft: #e8f2f3;
  --on-teal: #ffffff;
  --gold: #b8923a;
  --gold-ink: #86661b;
  --gold-soft: #f6efdc;
  --leaf: #5f8a4e;
  --focus: #1b7f8c;
  color-scheme: only light;   /* light only: no dark theme, and browsers must not force one */
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --bh: 132px;           /* approximate header height */
  --th: 108px;           /* height of the tool logo mark */
  --font-uni: "Alexandria", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --banner-bg: #ffffff;
}
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: only light; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--banner-bg);
}
button, textarea, a { font-family: var(--font); }
button, textarea { font-size: inherit; color: inherit; }
textarea { background-color: #ffffff; color: var(--fg); caret-color: var(--teal); }
textarea::placeholder { color: #5b6f76; opacity: 1; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header: university logo and texts (start), tool logo (center), menu button (end) */
.top { background: var(--banner-bg); border-bottom: 1px solid var(--gold); padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.top-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.uni { display: flex; align-items: center; gap: 12px; min-width: 0; }
.kau { flex: none; height: 72px; width: auto; display: block; }
.uni-t { font-family: var(--font-uni); color: #3f5a62; line-height: 1.5; min-width: 0; }
.uni-t p { margin: 0; font-size: .78rem; font-weight: 400; }
.uni-t p.u1 { font-size: .95rem; font-weight: 600; color: #0f5560; }
/* The tool logo file has wide transparent margins; the box shows the logo area only (the file is unchanged). */
.tool { margin: 0; line-height: 0; justify-self: center; position: relative; overflow: hidden; height: var(--th); width: calc(var(--th) * 1.2192); }
.tool img { position: absolute; display: block; max-width: none; height: auto; width: calc(var(--th) * 1.4849); left: calc(var(--th) * -0.1334); top: calc(var(--th) * -0.1752); }
.menu-cell { justify-self: end; }
.menu-btn {
  width: 40px; height: 40px; display: grid; place-items: center;
  background: #fff; border: 1px solid #dbe5e8; border-radius: 10px; color: #0f5560;
}
.menu-btn:hover { background: #e8f2f3; }

/* shell and sidebar */
.shell { display: flex; align-items: stretch; min-height: calc(100dvh - var(--bh)); }
.side {
  flex: none; width: 176px; align-self: flex-start; position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: calc(100dvh - env(safe-area-inset-top, 0px)); padding: 16px 8px 16px 12px; padding-right: var(--gutter-r);
  border-inline-end: 1px solid var(--line);
}
.side[hidden] { display: none; }
.side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav {
  width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; text-align: start;
  background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--fg);
  font-size: .92rem; text-decoration: none; line-height: 1.5;
}
.nav svg { flex: none; width: 18px; height: 18px; }
.nav:hover:not(:disabled) { background: var(--teal-soft); }
.nav[aria-current="page"] { background: var(--teal-soft); color: var(--teal); font-weight: 600; }
.nav:disabled { color: var(--muted); cursor: default; }
.tag { margin-inline-start: 28px; font-size: .7rem; color: var(--muted); line-height: 1.4; }
.backdrop { display: none; }

main {
  flex: 1; min-width: 0; padding-block: 32px 56px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.col { max-width: 640px; margin: 0 auto; }
.col:has(.report) { max-width: 760px; }

/* home: welcome block centered in the free area */
.home {
  min-height: calc(100dvh - var(--bh) - 88px); display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center;
  text-align: center; gap: 0;
}
.home-main { grid-row: 2; display: grid; justify-items: center; }
.home h2 { margin: 0 0 12px; font-size: 2rem; line-height: 1.4; color: var(--teal); font-weight: 700; text-wrap: balance; }
.home p { margin: 0 0 28px; font-size: 1.05rem; color: var(--muted); max-width: 42ch; }
.home .btn-primary { min-height: 50px; padding: 8px 40px; font-size: 1.05rem; border-radius: 12px; }
.count { margin: 16px 0 0; font-size: .78rem; color: var(--muted); }
/* supervision and preparation credits at the bottom of the home page */
.credits { grid-row: 3; align-self: end; width: min(560px, 100%); margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 28px; font-family: var(--font-uni); text-align: start; }
.cr-l { display: block; font-size: .76rem; font-weight: 600; color: var(--gold-ink); }
.cr-n { display: block; font-size: .9rem; font-weight: 500; line-height: 1.7; color: var(--teal); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
  padding: 6px 20px; border-radius: 10px; font-size: .95rem; border: 1px solid var(--teal); font-weight: 600;
}
.btn-primary { background: var(--teal); color: var(--on-teal); }
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost { background: transparent; color: var(--teal); border-color: var(--line); }
.btn-ghost:hover:not(:disabled) { background: var(--teal-soft); border-color: var(--teal); }
.btn:disabled { opacity: .4; cursor: default; }

/* progress */
.prog { margin-bottom: 28px; }
.prog-row { display: flex; justify-content: space-between; gap: 12px; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
.bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 99px; transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

/* question */
.phase { margin: 0 0 8px; font-size: .82rem; font-weight: 600; color: var(--gold-ink); letter-spacing: .02em; }
.phase span { color: var(--muted); font-weight: 400; }
.q { margin: 0 0 10px; font-size: 1.55rem; line-height: 1.55; font-weight: 700; color: var(--fg); text-wrap: balance; }
.hint { margin: 0 0 4px; color: var(--muted); font-size: .9rem; }
.hint b { font-weight: 600; }
.lbl { display: block; margin: 22px 0 8px; font-weight: 600; font-size: .85rem; color: var(--muted); }
textarea {
  display: block; width: 100%; min-height: 130px; resize: vertical; padding: 12px 14px; line-height: 1.75;
  font-size: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
textarea:focus { border-color: var(--focus); outline: 0; box-shadow: 0 0 0 3px var(--teal-soft); }
.help-wrap { margin-top: 14px; }
.opts { margin-top: 16px; display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 10px; text-align: start; width: 100%; padding: 9px 14px; border-radius: 10px; min-height: 42px; font-size: .95rem;
  background: var(--surface); border: 1px solid var(--line);
}
.opt .mk { flex: none; position: relative; width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 50%; }
.opt.multi .mk { border-radius: 5px; }
.opt:hover { border-color: var(--teal); }
.opt[aria-checked="true"] { background: var(--teal-soft); border-color: var(--teal); font-weight: 600; color: var(--teal); }
.opt[aria-checked="true"] .mk { background: var(--teal); border-color: var(--teal); }
.opt.single[aria-checked="true"] .mk::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--on-teal); }
.opt.multi[aria-checked="true"] .mk::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid var(--on-teal); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.follow { margin-top: 20px; padding-inline-start: 14px; border-inline-start: 2px solid var(--gold); }
.follow .lbl { margin-top: 0; color: var(--teal); font-weight: 600; font-size: .95rem; }
textarea.sm { min-height: 84px; }
.nav-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; }
.nav-row .btn { flex: 0 1 140px; }
.link-btn { justify-self: start; background: none; border: 0; padding: 2px 0; color: var(--teal); font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }
.saved { margin: 12px 0 0; font-size: .78rem; color: var(--muted); }

.done { padding-top: 24px; }
.done h2 { margin: 0 0 8px; color: var(--teal); font-size: 1.3rem; }
.done p { margin: 0 0 20px; font-size: 1.05rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.confirm { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 10px; }
.confirm p { margin: 0 0 12px; }

/* report: modern analytical document on a white sheet (fixed light colors, also used for print) */
.rep-actions { display: grid; gap: 10px; margin-bottom: 14px; }
.rep-actions .btn { min-height: 38px; padding: 4px 14px; font-size: .88rem; }
.ans { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.none { margin: 0; color: #5b727a; font-size: .9em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.chip { display: inline-block; padding: 1px 11px; border-radius: 99px; border: 1px solid #b9d3d6; background: #eef5f6; color: #0f5560; font-size: .86em; font-weight: 600; }
.chips:last-child { margin-bottom: 0; }
.doc {
  --d-ink: #17323a; --d-mut: #5b727a; --d-line: #dbe5e8; --d-teal: #0f5560; --d-teal-soft: #eef5f6;
  --d-gold: #b8923a; --d-gold-ink: #86661b; --d-gold-soft: #fbf7ec; --d-leaf: #3f6f37; --d-leaf-soft: #f1f6ef;
  font-family: var(--font-uni); background: #fff; color: var(--d-ink); font-size: .95rem; line-height: 1.8;
  border: 1px solid var(--d-line); border-radius: 12px; padding: 28px 30px;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.doc h2, .doc h3, .doc h4, .doc p { margin: 0; }
.dh { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--d-gold); }
.dh-uni { display: flex; align-items: center; gap: 12px; min-width: 0; }
.dh-uni img { flex: none; height: 62px; width: auto; display: block; }
.dh-t p { font-size: .76rem; line-height: 1.5; color: #3f5a62; }
.dh-t p:first-child { font-size: .92rem; font-weight: 600; color: var(--d-teal); }
.dh-tool { flex: none; position: relative; overflow: hidden; --th: 74px; height: var(--th); width: calc(var(--th) * 1.2192); }
.dh-tool img { position: absolute; display: block; max-width: none; height: auto; width: calc(var(--th) * 1.4849); left: calc(var(--th) * -0.1334); top: calc(var(--th) * -0.1752); }
.dt { padding: 18px 0 4px; }
.dt h2 { font-size: 1.7rem; font-weight: 600; line-height: 1.4; color: var(--d-teal); }
.dt p { font-size: .98rem; color: var(--d-mut); }
.rsec { margin-top: 24px; }
.rh { display: flex; align-items: baseline; gap: 10px; padding-bottom: 7px; margin-bottom: 12px; border-bottom: 1px solid var(--d-line); font-size: 1.15rem; font-weight: 600; color: var(--d-teal); line-height: 1.5; }
.rh .no { color: var(--d-gold-ink); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.field { border: 1px solid var(--d-line); border-radius: 8px; padding: 8px 12px; min-width: 0; }
.field h4, .lead h4, .quote h4 { margin-bottom: 3px; font-size: .78rem; font-weight: 500; color: var(--d-mut); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stack { display: grid; gap: 10px; }
.lead { padding: 10px 14px; border: 1px solid #b9d3d6; border-inline-start: 4px solid var(--d-teal); border-radius: 8px; background: var(--d-teal-soft); }
.lead .ans { font-size: 1.02rem; }
.quote { padding: 4px 14px; border-inline-start: 3px solid var(--d-gold); }
.quote .ans { font-size: 1.02rem; }
.flow { display: grid; }
.stage { position: relative; padding-inline-start: 22px; padding-bottom: 14px; border-inline-start: 2px solid var(--d-line); }
.stage:last-child { padding-bottom: 0; border-inline-color: transparent; }
.stage::before { content: ""; position: absolute; inset-inline-start: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--d-gold); }
.stage > h3 { margin-bottom: 6px; font-size: .82rem; font-weight: 600; color: var(--d-gold-ink); }
.insights-note { margin: -4px 0 10px; font-size: .84rem; color: var(--d-mut); }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.insight { padding: 9px 14px; border: 1px solid var(--d-line); border-top-width: 3px; border-radius: 8px; }
.insight h3 { margin-bottom: 2px; font-size: .84rem; font-weight: 600; }
.insight p { font-size: .96rem; }
.insight.lv-decision { border-top-color: var(--d-teal); background: var(--d-teal-soft); }
.insight.lv-decision h3 { color: var(--d-teal); }
.insight.lv-alternatives { border-top-color: var(--d-gold); background: var(--d-gold-soft); }
.insight.lv-alternatives h3 { color: var(--d-gold-ink); }
.insight.lv-improvement { border-top-color: var(--d-leaf); background: var(--d-leaf-soft); }
.insight.lv-improvement h3 { color: var(--d-leaf); }
.col:has(.report) { max-width: 860px; }
@media (max-width: 640px) {
  .doc { padding: 18px 16px; }
  .dh { flex-wrap: wrap; }
  .dh-uni img { height: 50px; }
  .dh-tool { --th: 60px; }
  .dt h2 { font-size: 1.4rem; }
  .fields { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 700px) {
  .top-in { grid-template-columns: auto 1fr auto; gap: 8px; }
}
@media (max-width: 640px) {
  :root { --bh: 96px; --th: 78px; }
  .top { padding-block: 6px; }
  .kau { height: 50px; }
  .uni { gap: 8px; }
  .uni-t p { font-size: .62rem; line-height: 1.4; }
  .uni-t p.u1 { font-size: .7rem; }
  .menu-btn { width: 36px; height: 36px; }
}
@media (max-width: 400px) {
  :root { --th: 70px; }
  .uni-t p { font-size: .56rem; }
  .uni-t p.u1 { font-size: .64rem; }
  .uni { gap: 6px; }
}
@media (max-width: 359px) {
  .uni-t p { font-size: .5rem; }
  .uni-t p.u1 { font-size: .58rem; }
  :root { --th: 62px; }
  .kau { height: 42px; }
}
@media (max-width: 800px) {
  .side {
    position: fixed; z-index: 35; top: 0; right: 0; height: 100dvh; width: min(220px, 72vw);
    padding-top: calc(env(safe-area-inset-top, 0px) + 24px); padding-left: 12px;
    background: var(--surface); border-inline-end: 0; border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12);
  }
  .backdrop { position: fixed; inset: 0; z-index: 34; background: rgba(10, 30, 36, .35); }
  .backdrop:not([hidden]) { display: block; }
  main { padding-block: 24px 48px; }
  .home { min-height: calc(100dvh - var(--bh) - 72px); }
  .home h2 { font-size: 1.6rem; }
  .credits { grid-template-columns: minmax(0, 1fr); text-align: center; gap: 12px; margin-top: 28px; }
  .q { font-size: 1.3rem; }
  .prog { margin-bottom: 22px; }
}
@page { size: A4; margin: 11mm 13mm; }
@media print {
  html, body { background: #fff !important; color: #17323a !important; color-scheme: only light; height: auto; }
  body { font-size: 10pt; }
  .top, .side, .backdrop, .no-print, .rep-actions, .credits, body::before { display: none !important; }
  .shell { display: block; min-height: 0; }
  main { padding: 0; }
  .col, .col:has(.report) { max-width: none; margin: 0; }
  .doc { border: 0; border-radius: 0; padding: 0; font-size: 10pt; line-height: 1.65; }
  .dh { padding-bottom: 8px; }
  .dh-uni img { height: 15mm; }
  .dh-t p { font-size: 8pt; }
  .dh-t p:first-child { font-size: 10pt; }
  .dh-tool { --th: 19mm; }
  .dt { padding: 10px 0 2px; }
  .dt h2 { font-size: 19pt; }
  .dt p { font-size: 10pt; }
  .rsec { margin-top: 13px; }
  .rh { font-size: 12.5pt; margin-bottom: 8px; padding-bottom: 4px; break-after: avoid; }
  .field, .lead, .quote, .stage, .insight, .fields > * { break-inside: avoid; }
  .field h4, .lead h4, .quote h4 { font-size: 8pt; }
  .stage > h3 { break-after: avoid; }
  .insight p, .lead .ans, .quote .ans { font-size: 10pt; }
  .insights-note { font-size: 8.5pt; }
  .chip { font-size: 8.5pt; }
  .ans { orphans: 3; widows: 3; }
  .doc > *:last-child, .rsec:last-child { margin-bottom: 0; }
}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="uni">
      <img class="kau" src="KAU_logo.png" width="301" height="383" alt="شعار جامعة الملك عبدالعزيز">
      <div class="uni-t">
        <p class="u1">جامعة الملك عبدالعزيز</p>
        <p>كلية التربية</p>
        <p>قسم المناهج وطرق التدريس</p>
        <p>ماجستير المناهج وطرق التدريس</p>
      </div>
    </div>
    <h1 class="tool"><img src="reflective-investigator-logo.png" width="1280" height="1229" alt="المحقق التأملي — أداة لدعم المعلمة في ممارسة التدريس التأملي"></h1>
    <div class="menu-cell">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="القائمة الجانبية" aria-controls="side" aria-expanded="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="القائمة الجانبية">
    <ul>
      <li><button class="nav" type="button" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button></li>
      <li><button class="nav" type="button" data-go="session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>جلسة التأمل</button></li>
      <li><button class="nav" type="button" data-go="results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>نتائج تأملي</button></li>
      <li id="evalLi"></li>
    </ul>
  </nav>
  <div class="backdrop" id="backdrop" hidden></div>
  <main id="main"><div class="col" id="view"></div></main>
</div>

<script>
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";

const PHASES = [
  "المرحلة 1 — فهم الموقف والقرار",
  "المرحلة 2 — مراجعة القرار",
  "المرحلة 3 — البدائل والأدلة",
  "المرحلة 4 — خطة التحسين"
];
// Stable ids: questions and options are referenced by id, never by text.
const QUESTIONS = [
 {
  "id": "situation",

const N = QUESTIONS.length;
const KEY = "muhaqqiq-taammuli-v2";   // answers saved by an earlier question set (v1) are not reused

// Saved shape: { view, step, counted, answers: { [questionId]: { sel: [optionId], text, other } } }
let state = { view: "home", step: 0, answers: {}, counted: false };
let memoryOnly = false;
const isChoice = (q) => q.type !== "text";
const isMulti = (q) => q.type === "multi" || q.type === "multi_text";
const hasWrite = (q) => q.type === "text" || q.type === "single_text" || q.type === "multi_text";
function cleanAnswer(q, raw) {
  const r = raw && typeof raw === "object" ? raw : {};
  let sel = Array.isArray(r.sel) ? r.sel.filter((id, k, all) => q.opts && q.opts.some((o) => o.id === id) && all.indexOf(id) === k) : [];
  if (!isChoice(q)) sel = [];
  else if (!isMulti(q)) sel = sel.slice(0, 1);
  else if (q.exclusive && sel.includes(q.exclusive) && sel.length > 1) sel = [q.exclusive];
  return {
    sel,
    text: hasWrite(q) && typeof r.text === "string" ? r.text : "",
    other: q.other && sel.includes(q.other) && typeof r.other === "string" ? r.other : ""
  };
}
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const s = JSON.parse(raw);
    if (s && typeof s === "object") {
      state.view = ["home", "session", "done"].includes(s.view) ? s.view : "home";
      state.step = Math.min(Math.max(parseInt(s.step) || 0, 0), N - 1);
      state.counted = !!s.counted;
      const src = s.answers && typeof s.answers === "object" ? s.answers : {};
      QUESTIONS.forEach((q) => { state.answers[q.id] = cleanAnswer(q, src[q.id]); });
    }
  }
} catch (e) { memoryOnly = true; }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); memoryOnly = false; } catch (e) { memoryOnly = true; }
}

const $ = (s) => document.querySelector(s);
const view = $("#view");
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ans = (q) => state.answers[q.id] || (state.answers[q.id] = cleanAnswer(q, null));
const selOf = (qid) => (state.answers[qid] && state.answers[qid].sel) || [];
const has = (qid, oid) => selOf(qid).includes(oid);
const hasAny = (qid, ...oids) => oids.some((o) => has(qid, o));
const qById = (id) => QUESTIONS.find((q) => q.id === id);

// A question is complete by its answer type. The "other" detail box is optional.
function qDone(q) {
  const a = state.answers[q.id] || {};
  const n = (a.sel || []).length, t = (a.text || "").trim();
  switch (q.type) {
    case "text": return !!t;
    case "single": return n === 1;
    case "multi": return n >= 1;
    case "single_text": return n === 1 && !!t;
    case "multi_text": return n >= 1 && !!t;
  }
  return false;
}
function firstMissing() { const i = QUESTIONS.findIndex((q) => !qDone(q)); return i < 0 ? undefined : i; }

// ---------- Feedback link and usage counter ----------
const FORM_URL = "https://forms.gle/if3XBZ3w3FGXa3ZM7";
const API = "/api/sessions";
let totalCount = null;     // only ever set from a real server answer
let counting = false;
let evalOn = null;

// The feedback form unlocks once the reflection session is complete.
function updateEvalNav() {
  const on = firstMissing() === undefined;
  if (on === evalOn) return;
  evalOn = on;
  $("#evalLi").innerHTML = on
    ? `<a class="nav" href="${FORM_URL}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>تقييم التجربة</a>`
    : `<button class="nav" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>تقييم التجربة <span class="tag">بعد اكتمال الجلسة</span></button>`;
}
function updateCountEl() {
  const el = $("#countLine");
  if (!el) return;
  if (totalCount === null) { el.hidden = true; return; }
  el.textContent = "عدد جلسات التأمل: " + totalCount.toLocaleString("en");
  el.hidden = false;
}
async function api(opts) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 6000);
  try { return await fetch(API, { cache: "no-store", signal: ctl.signal, ...opts }); }
  finally { clearTimeout(t); }
}
async function loadCount() {
  try {
    const r = await api({});
    if (!r.ok) return;
    const d = await r.json();
    if (typeof d.total === "number") { totalCount = d.total; updateCountEl(); }
  } catch (e) { /* no number is shown when the service is unreachable */ }
}
// Counts one start per session. Failures never affect the tool.
async function countStart() {
  if (state.counted || counting) return;
  counting = true;
  try {
    const r = await api({ method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ event: "start" }) });
    if (r.ok || r.status === 429) {
      state.counted = true; save();
      if (r.ok) { const d = await r.json(); if (typeof d.total === "number") { totalCount = d.total; updateCountEl(); } }
    }
  } catch (e) { /* try again at the next start */ }
  finally { counting = false; }
}

function render() {
  document.querySelectorAll(".nav[data-go]").forEach((b) => {
    const on = b.dataset.go === (state.view === "home" ? "home" : state.view === "done" ? "results" : "session");
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  updateEvalNav();
  if (state.view === "home") renderHome();
  else if (state.view === "done") renderDone();
  else renderQuestion();
}

function renderHome() {
  const started = Object.values(state.answers).some((a) => a && ((a.text || "").trim() || (a.sel || []).length));
  view.innerHTML = `
    <section class="home">

        <h2>كل موقف تدريسي يحمل فرصة للتعلّم</h2>

        <div><span class="cr-l">إعداد الطالبات:</span><span class="cr-n">فاطمه عمر القاسم</span><span class="cr-n">غدير خالد الزهراني</span><span class="cr-n">فاطمة علي المنتشري</span></div>
      </footer>
    </section>`;
  updateCountEl(); loadCount();

function renderQuestion() {
  const i = state.step, q = QUESTIONS[i], a = ans(q);
  const last = i === N - 1;
  const multi = isMulti(q);
  const optsHtml = isChoice(q) ? `
    <div class="opts" role="${multi ? "group" : "radiogroup"}" aria-labelledby="qtext">
      ${q.opts.map((o) => `<button class="opt ${multi ? "multi" : "single"}" type="button" role="${multi ? "checkbox" : "radio"}" data-id="${o.id}" aria-checked="${a.sel.includes(o.id)}"><span class="mk" aria-hidden="true"></span><span>${esc(o.label)}</span></button>`).join("")}
    </div>
    ${q.other ? `<div class="follow" id="otherBox" hidden>
      <label class="lbl" for="other">اكتبي التفاصيل</label>
      <textarea id="other" class="sm" placeholder="اكتبي إجابتك هنا"></textarea>
    </div>` : ""}` : "";
  const writeHtml = hasWrite(q) ? (q.type === "text"
    ? `<label class="lbl" for="ans">إجابتك</label>
       <textarea id="ans" class="${q.short ? "sm" : ""}" placeholder="اكتبي إجابتك هنا"></textarea>`
    : `<div class="follow">
         <label class="lbl" for="ans">${esc(q.writeQ)}</label>
         <textarea id="ans" class="sm" placeholder="اكتبي إجابتك هنا"></textarea>
       </div>`) : "";
  view.innerHTML = `
    <div class="prog" role="group" aria-label="مؤشر التقدم">
      <div class="prog-row"><span>السؤال ${i + 1} من ${N}</span></div>
      <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="${N}" aria-valuenow="${i + 1}"><i style="width:${((i + 1) / N) * 100}%"></i></div>
    </div>
    <p class="phase">${esc(PHASES[q.phase])}</p>
    <h2 class="q" id="qtext">${esc(q.q)}</h2>
    ${q.hint ? `<p class="hint"><b>توجيه:</b> ${esc(q.hint)}</p>` : ""}
    ${optsHtml}
    ${writeHtml}
    <div class="nav-row">
      <button class="btn btn-ghost" type="button" id="prevBtn" ${i === 0 ? "disabled" : ""}>السابق</button>
      <button class="btn btn-primary" type="button" id="nextBtn">${last ? "إنهاء الجلسة" : "التالي"}</button>
    </div>
    <p class="saved">${memoryOnly ? "تعذر الحفظ في هذا المتصفح. ستبقى الإجابات حتى تغلقين الصفحة." : "تُحفظ إجاباتك تلقائيًا على هذا الجهاز."}</p>`;

  const ta = $("#ans"), ot = $("#other");
  if (ta) { ta.value = a.text; ta.oninput = () => { a.text = ta.value; save(); updateEvalNav(); }; }
  if (ot) { ot.value = a.other; ot.oninput = () => { a.other = ot.value; save(); }; }

  function syncChoices() {
    view.querySelectorAll(".opt").forEach((b) => b.setAttribute("aria-checked", String(a.sel.includes(b.dataset.id))));
    const ob = $("#otherBox");
    if (ob) ob.hidden = !(q.other && a.sel.includes(q.other));
  }
  syncChoices();
  view.querySelectorAll(".opt").forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.id, on = a.sel.includes(id);
      if (!multi) a.sel = [id];                                   // single choice: picking another replaces it
      else if (on) a.sel = a.sel.filter((x) => x !== id);         // multiple: toggle
      else if (id === q.exclusive) a.sel = [id];                  // "nothing missed" excludes the others
      else a.sel = a.sel.filter((x) => x !== q.exclusive).concat(id);
      if (!(q.other && a.sel.includes(q.other))) { a.other = ""; if (ot) ot.value = ""; }
      save(); syncChoices(); updateEvalNav();
    };
  });
  $("#prevBtn").onclick = () => step(-1);
  $("#nextBtn").onclick = () => step(1);
}

function step(dir) {
  const n = state.step + dir;
  if (n >= N) state.view = "done";
  else if (n >= 0) state.step = n;
  save(); render(); window.scrollTo(0, 0);
}

// ---------- Analysis engine (three independent levels) ----------
// Rules read structured choices only, by option id, never the free text. Texts are suggestions for reflection.
// Each level checks its rules in priority order and uses the first one that matches (or the level's fallback text).
// A level never affects another level, so a rule in one level cannot hide the insight of another.
// Conditions: { q, pick:[optionIds] } = the question includes any of these; { all:[...] } = every part; { any:[...] } = at least one part.
const INSIGHT_LEVELS = [
 {
  id: "decision", title: "قراءة القرار التدريسي",
  fallback: "يمكنك مراجعة العلاقة بين هدفك من التصرف والنتيجة التي لاحظتِها، وتحديد ما قد يساعدك على فهم هذه العلاقة بصورة أدق.",
  rules: [
   { id: "D1", when: {"q": "blindspots", "pick": ["feelings"]},

 },
 {

  rules: [
   { id: "I1", when: {"all": [{"q": "step", "pick": ["short_assessment"]}, {"q": "measure", "pick": ["compare_assessment"]}]},
     text: "عند مقارنة النتائج، استخدمي أسئلة تقيس الهدف التعليمي نفسه وبمستوى صعوبة متقارب؛ حتى تكون المقارنة أكثر دلالة." },

     text: "سجلي عدد مرات ظهور السلوك أو المشكلة قبل تعديل النشاط وبعده، مع مراعاة اختلاف ظروف الحصص." },
   { id: "I6", when: {"all": [{"q": "step", "pick": ["new_strategy"]}, {"q": "measure", "pick": ["participation"]}]},
     text: "تابعي المشاركة أثناء تنفيذ الاستراتيجية، وتحققي أيضًا من تحقق التعلم؛ فارتفاع التفاعل لا يعني بالضرورة تحسن الفهم." },
  ]
 },
];

function matchNode(n) {
  if (n.all) return n.all.every(matchNode);
  if (n.any) return n.any.some(matchNode);
  return hasAny(n.q, ...n.pick);
}
// Returns one insight per level: { level, title, ruleId (null when the fallback is used), text }.
function analyze() {
  return INSIGHT_LEVELS.map((lv) => {
    const r = lv.rules.find((x) => matchNode(x.when));
    return { level: lv.id, title: lv.title, ruleId: r ? r.id : null, text: r ? r.text : lv.fallback };
  });
}

// ---------- Report ----------
// mode: all | choices | text. quiet: return "" instead of the empty notice.
const NONE = `<p class="none">لم تُسجّل إجابة</p>`;
const para = (t) => `<p class="ans">${esc(t)}</p>`;
function entry(qid, mode = "all", quiet = false) {
  const q = qById(qid), a = state.answers[qid] || { sel: [], text: "", other: "" };
  let h = "";
  if (mode !== "text" && isChoice(q)) {
    const chosen = q.opts.filter((o) => a.sel.includes(o.id));
    if (chosen.length) h += `<div class="chips">${chosen.map((o) => `<span class="chip">${esc(o.label)}</span>`).join("")}</div>`;
    if (a.other && a.other.trim()) h += para(a.other.trim());
  }
  if (mode !== "choices" && hasWrite(q) && (a.text || "").trim()) h += para(a.text.trim());
  return h || (quiet ? "" : NONE);
}
const fld = (cap, html, cls = "") => `<div class="field ${cls}"><h4>${esc(cap)}</h4>${html}</div>`;
const lead = (cap, html) => `<div class="lead"><h4>${esc(cap)}</h4>${html}</div>`;
const quote = (cap, html) => `<div class="quote"><h4>${esc(cap)}</h4>${html}</div>`;
const rsec = (no, title, body) => `<section class="rsec"><h3 class="rh"><span class="no">${no}</span><span>${esc(title)}</span></h3>${body}</section>`;
const INSIGHTS_NOTE = "رؤى مقترحة بناءً على اختياراتك، لدعم التفكير التأملي وليست تقييمًا لأدائك التدريسي.";

function renderDone() {
  const miss = firstMissing();
  if (miss !== undefined) {
    view.innerHTML = `
      <section class="done">
        <p>تقريرك التأملي لم يكتمل بعد. أكملي إجاباتك أولًا لعرض النتائج.</p>
        <button class="btn btn-primary" type="button" id="contBtn">متابعة جلسة التأمل</button>
      </section>`;
    $("#contBtn").onclick = () => { state.view = "session"; state.step = miss; save(); render(); window.scrollTo(0, 0); };
    return;
  }
  const insights = analyze();
  const hasAction = selOf("step").length > 0;
  const stepIdx = QUESTIONS.findIndex((q) => q.id === "step");

  const s1 = rsec("01", "موقفي وقراري",
    `<div class="stack">
      ${lead("وصف الموقف", entry("situation"))}
      ${fld("تصرفي", entry("action"))}
      <div class="fields">${fld("الهدف من التصرف", entry("goal"))}${fld("نتيجة التصرف", entry("result"))}</div>
      ${fld("أسباب اتخاذ القرار", entry("reason"))}
    </div>`);
  const s2 = rsec("02", "ماذا تعلمت من الموقف؟",
    `<div class="stack">
      ${fld("ما أعدت التفكير فيه", entry("blindspots"))}
      ${quote("اكتشافي", entry("learning"))}
      ${quote("تذكيري لنفسي", entry("reminder"))}
    </div>`);
  const s3 = rsec("03", "خطتي للتحسين",
    `<div class="flow">
      <div class="stage"><h3>البدائل والأدلة</h3><div class="stack">
        ${fld("البدائل التي كان بإمكاني استخدامها", entry("alternatives"))}
        ${fld("المعلومات والأدلة التي أحتاج إليها", entry("evidence"))}
      </div></div>
      <div class="stage"><h3>الإجراء</h3><div class="stack">
        ${fld("خطوة التحسين المختارة", hasAction ? entry("step", "choices")
          : `<p class="none">لم يتم تحديد إجراء بعد</p><button class="link-btn no-print" type="button" data-goto="${stepIdx}">تعديل إجابة السؤال 9</button>`)}
        ${fld("كيف سأطبقها؟", entry("step", "text"))}
      </div></div>
      <div class="stage"><h3>قياس الأثر</h3><div class="stack">
        ${fld("كيف سأقيس أثرها؟", entry("measure"))}
      </div></div>
    </div>`);
  const s4 = rsec("04", "رؤى تربوية مقترحة",
    `<p class="insights-note">${esc(INSIGHTS_NOTE)}</p>
    <ul class="notes">${insights.map((n) => `<li class="insight lv-${n.level}" data-level="${n.level}" data-rule="${n.ruleId || ""}"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></li>`).join("")}</ul>`);

  view.innerHTML = `
    <section class="report">
      <div class="rep-actions no-print">
        <div class="row">
          <button class="btn btn-ghost" type="button" id="editBtn">تعديل إجاباتي</button>
          <button class="btn btn-ghost" type="button" id="printBtn">طباعة التقرير / حفظ PDF</button>
          <button class="btn btn-ghost" type="button" id="resetBtn">بدء تأمل جديد</button>
        </div>
        <p class="saved" id="printHint" hidden>إذا لم تظهر نافذة الطباعة، افتحي الأداة في نافذة المتصفح ثم اضغطي Ctrl+P. لإخفاء ترويسة المتصفح وتذييله من ملف PDF، عطّلي خيار Headers and footers في نافذة الطباعة.</p>
        <div id="confirmBox"></div>
      </div>
      <article class="doc">
        <header class="dh">
          <div class="dh-uni">
            <img src="KAU_logo.png" width="301" height="383" alt="شعار جامعة الملك عبدالعزيز">
            <div class="dh-t">
              <p>جامعة الملك عبدالعزيز</p>
              <p>كلية التربية</p>
              <p>قسم المناهج وطرق التدريس</p>
              <p>ماجستير المناهج وطرق التدريس</p>
            </div>
          </div>
          <div class="dh-tool"><img src="reflective-investigator-logo.png" width="1280" height="1229" alt="المحقق التأملي"></div>
        </header>
        <div class="dt"><h2>تقريري التأملي</h2><p>توثيق الممارسة والتفكير في فرص التحسين</p></div>
        ${s1}${s2}${s3}${s4}
      </article>
    </section>`;

  $("#editBtn").onclick = () => { state.view = "session"; state.step = N - 1; save(); render(); window.scrollTo(0, 0); };
  $("#printBtn").onclick = () => { $("#printHint").hidden = false; try { window.print(); } catch (e) {} };
  view.querySelectorAll("[data-goto]").forEach((b) => (b.onclick = () => { state.view = "session"; state.step = +b.dataset.goto; save(); render(); window.scrollTo(0, 0); }));
  $("#resetBtn").onclick = () => {
    $("#confirmBox").innerHTML = `<div class="confirm"><p>سيتم حذف كل إجاباتك المحفوظة والتقرير الحالي. هل تريدين المتابعة؟</p>
      <div class="row"><button class="btn btn-primary" type="button" id="yesReset">نعم، ابدئي تأملًا جديدًا</button>
      <button class="btn btn-ghost" type="button" id="noReset">إلغاء</button></div></div>`;
    $("#yesReset").onclick = () => {
      state = { view: "session", step: 0, answers: {}, counted: false };
      QUESTIONS.forEach((q) => ans(q));
      save(); render(); window.scrollTo(0, 0); countStart();
    };
    $("#noReset").onclick = () => { $("#confirmBox").innerHTML = ""; };
  };
}

function go(v) {
  state.view = v === "results" ? "done" : v === "session" ? "session" : "home";
  save(); render(); window.scrollTo(0, 0);
  if (v === "session") countStart();
  if (mobile()) setSide(false);
}

const side = $("#side"), menuBtn = $("#menuBtn"), backdrop = $("#backdrop");
const mobile = () => window.matchMedia("(max-width: 800px)").matches;
function setSide(open) {
  side.hidden = !open;
  menuBtn.setAttribute("aria-expanded", String(open));
  backdrop.hidden = !(open && mobile());
}
menuBtn.onclick = () => setSide(side.hidden);
backdrop.onclick = () => setSide(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && mobile()) setSide(false); });
document.querySelectorAll(".nav[data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go)));
setSide(!mobile());

render();
</script>
